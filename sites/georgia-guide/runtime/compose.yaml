name: enotis-georgia-review
services:
  site:
    build:
      context: .
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./preview-data:/data
      - ./preview-uploads:/var/www/html/public/uploads
      - ./preview-seed:/seed:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
