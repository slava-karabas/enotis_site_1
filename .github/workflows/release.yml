# Релиз движка (спецификация 2.1, раздел 14.2). Сам: после слияния в main, если в коде новая
# версия ENGINE_VERSION, для которой ещё нет релиза. Вручную — тегом vX.Y.Z.
# ZIP кода + latest.json + ZIP «Паломника» → релиз на GitHub и папка update.enotis.shop по FTP.
# Сервер обновлений: секрет UPDATE_FTP_DIR — папка update.enotis.shop на хостинге (например /www/update.enotis.shop).
# Вход по FTP — тот же, что у выкладки тестового сайта (FTP_HOST, FTP_USER, FTP_PASSWORD);
# если для update нужен другой вход — UPDATE_FTP_HOST, UPDATE_FTP_USER, UPDATE_FTP_PASSWORD.
# Пока UPDATE_FTP_DIR нет, файлы остаются только в релизе на GitHub.
name: release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, zip
      - name: Версия и нужен ли релиз
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -o "ENGINE_VERSION = '[0-9.]*'" app/bootstrap.php | grep -o "[0-9][0-9.]*")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$v" = "$GITHUB_REF_NAME" || { echo "Тег $GITHUB_REF_NAME, а в коде $v"; exit 1; }
          fi
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Релиз v$v уже есть — пропускаю"; echo "need=no" >> "$GITHUB_OUTPUT"
          else
            echo "need=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Сборка
        run: php bin/build-release.php dist
      - name: Релиз на GitHub
        if: steps.v.outputs.need == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Энотис $TAG" --notes-file <(php -r '$j=json_decode(file_get_contents("dist/latest.json"),true); foreach($j["notes"]["ru"]??[] as $n) echo "- $n\n";')
      # Выкладывается при каждом слиянии: если папку подключили позже, версия всё равно туда попадёт.
      - name: На сервер обновлений
        env:
          HOST: ${{ secrets.UPDATE_FTP_HOST || secrets.FTP_HOST }}
          USER: ${{ secrets.UPDATE_FTP_USER || secrets.FTP_USER }}
          PASS: ${{ secrets.UPDATE_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          DIR: ${{ secrets.UPDATE_FTP_DIR }}
        run: |
          if [ -z "$DIR" ] || [ -z "$HOST" ]; then echo "Нет UPDATE_FTP_DIR или FTP-входа — пропускаю"; exit 0; fi
          # Сначала ZIP, последним latest.json: сайты не увидят версию раньше, чем файл.
          for f in dist/enotis-*.zip dist/palomnik-site.zip dist/latest.json; do
            curl -sS --ssl --ftp-create-dirs --user "$USER:$PASS" -T "$f" "ftp://$HOST/${DIR%/}/"
          done
