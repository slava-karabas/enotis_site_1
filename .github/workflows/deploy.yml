# Выкладка на reg.ru по FTP после каждого пуша в main.
# Нужны секреты репозитория: FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_DIR.
# Пока их нет, выкладка пропускается, а проверка PHP всё равно идёт.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Есть ли FTP-секреты
        id: secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: echo "ready=$([ -n "$FTP_HOST" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Выкладка по FTP
        if: steps.secrets.outputs.ready == 'yes'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            docs/**
            data/site.sqlite*
            data/*.lock
            data/config.php
            data/reset-password.txt
            data/backups/**
            data/uploads/**
            public/uploads/**
      - name: Секретов нет
        if: steps.secrets.outputs.ready != 'yes'
        run: echo "::notice::FTP-секреты не заданы, выкладка пропущена."
