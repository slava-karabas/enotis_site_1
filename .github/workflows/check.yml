name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, gd, zip, mbstring, curl
      - name: Проверки панели, импорта, фото, резервных копий и обновления
        run: tests/run.sh
